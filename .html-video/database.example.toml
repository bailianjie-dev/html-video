[database]
# Set to true to use PostgreSQL. Set to false to skip DB writes in dev-only checks.
enabled = true

# PostgreSQL connection settings. Copy this file to database.toml and fill in real values.
host = "192.168.*.**"
port = 5432
name = "html_video"
user = "***"
password = "***"

# Pool settings.
pool_min_size = 2
pool_max_size = 10
pool_timeout = 30
connect_timeout = 10
